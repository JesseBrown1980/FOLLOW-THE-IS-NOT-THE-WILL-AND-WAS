name: Public IS tournament

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tournament:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the exact public revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Select Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Select Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Select exact Rust 1.81
        run: |
          rustup toolchain install 1.81.0 --profile minimal --component clippy,rustfmt
          test "$(rustc +1.81.0 --version)" = "rustc 1.81.0 (eeb90cda1 2024-09-04)"
          test "$(cargo +1.81.0 --version)" = "cargo 1.81.0 (2dbb1af80 2024-08-20)"

      - name: Verify the 3 D GitHub THRUTH matrix
        run: python matrix/verify_3d_github_harness.py

      - name: Verify the public spherical matrix
        run: |
          python -m unittest discover -s tests -p "test_*.py"
          python tests/verify_public_repo.py
          python matrix/test_owner3d_to_public2d.py
          python matrix/test_collect_public_folder_inventory.py
          python matrix/test_spherical_public_projection.py
          python matrix/test_render_public_spherical_svg.py
          python matrix/test_timed_chiral_gguf_monitor.py
          python matrix/spherical_public_projection.py verify matrix/PUBLIC-SPHERICAL-PROJECTION.hbp

      - name: Verify the exact-integer QPRISM color canopy
        run: |
          cargo +1.81.0 fmt --manifest-path matrix/rust-qprism-181/Cargo.toml -- --check
          cargo +1.81.0 test --manifest-path matrix/rust-qprism-181/Cargo.toml --locked
          cargo +1.81.0 clippy --manifest-path matrix/rust-qprism-181/Cargo.toml --all-targets --locked -- -D warnings -D clippy::float_arithmetic
          mkdir "${RUNNER_TEMP}/qprism-a"
          mkdir "${RUNNER_TEMP}/qprism-b"
          for output in \
            "${RUNNER_TEMP}/qprism-a" \
            "${RUNNER_TEMP}/qprism-b"
          do
            cargo +1.81.0 run --manifest-path matrix/rust-qprism-181/Cargo.toml --bin rust-qprism-181 --release --locked -- \
              matrix/PUBLIC-OWNER-2D.hbp \
              "${output}/PUBLIC-QPRISM-COLOR-LEAVES.hbp" \
              "${output}/PUBLIC-QPRISM-COLOR-LEAVES.svg" \
              --replace
          done
          for name in \
            PUBLIC-QPRISM-COLOR-LEAVES.hbp \
            PUBLIC-QPRISM-COLOR-LEAVES.hbp.sha256 \
            PUBLIC-QPRISM-COLOR-LEAVES.svg \
            PUBLIC-QPRISM-COLOR-LEAVES.svg.sha256
          do
            cmp "${RUNNER_TEMP}/qprism-a/${name}" "${RUNNER_TEMP}/qprism-b/${name}"
          done

      - name: Verify the four-by-three outward truth waves
        run: |
          mkdir "${RUNNER_TEMP}/outward"
          cargo +1.81.0 run --manifest-path matrix/rust-qprism-181/Cargo.toml --bin outward-truth-waves --release --locked -- \
            matrix/PUBLIC-OWNER-3D-MEDIA-TREE.hbp \
            "${RUNNER_TEMP}/outward" \
            --replace
          for name in \
            PUBLIC-OUTWARD-TRUTH-WAVES.hbp \
            PUBLIC-OUTWARD-TRUTH-WAVES.hbp.sha256 \
            PUBLIC-OUTWARD-TRUTH-WAVES.hbi \
            PUBLIC-OUTWARD-TRUTH-WAVES.hbi.sha256 \
            PUBLIC-OUTWARD-TRUTH-WAVES.svg \
            PUBLIC-OUTWARD-TRUTH-WAVES.svg.sha256 \
            PUBLIC-OUTWARD-TRUTH-WAVES.gguf \
            PUBLIC-OUTWARD-TRUTH-WAVES.gguf.sha256
          do
            cmp "${RUNNER_TEMP}/outward/${name}" "matrix/${name}"
          done

      - name: Verify the public folder calming-OIL canopy
        run: |
          mkdir "${RUNNER_TEMP}/folder-calming-oils-a"
          mkdir "${RUNNER_TEMP}/folder-calming-oils-b"
          for output in \
            "${RUNNER_TEMP}/folder-calming-oils-a" \
            "${RUNNER_TEMP}/folder-calming-oils-b"
          do
            cargo +1.81.0 run --manifest-path matrix/rust-qprism-181/Cargo.toml --bin folder-calming-oils --release --locked -- \
              matrix/PUBLIC-FOLDER-3D-TREE.hbp \
              "${output}" \
              --replace
          done
          for name in \
            PUBLIC-FOLDER-CALMING-OILS.hbp \
            PUBLIC-FOLDER-CALMING-OILS.hbp.sha256 \
            PUBLIC-FOLDER-CALMING-OILS.hbi \
            PUBLIC-FOLDER-CALMING-OILS.hbi.sha256 \
            PUBLIC-FOLDER-CALMING-OILS.svg \
            PUBLIC-FOLDER-CALMING-OILS.svg.sha256 \
            PUBLIC-FOLDER-CALMING-OILS.gguf \
            PUBLIC-FOLDER-CALMING-OILS.gguf.sha256
          do
            cmp "${RUNNER_TEMP}/folder-calming-oils-a/${name}" "${RUNNER_TEMP}/folder-calming-oils-b/${name}"
          done
          ASOLARIA_FLOWES_SOURCE_DIR="${RUNNER_TEMP}/folder-calming-oils-a" \
            python matrix/test_build_timed_86400_flowes_x3x3.py

      - name: Verify the optional compact final FLOWes witness
        run: |
          final_dir="matrix/timed-86400-flowes-x3x3-final"
          final_required=0
          for marker_file in \
            README.md \
            matrix/README.md \
            matrix/3-D-GITHUB-OF-THRUTH.md
          do
            if grep -Fq 'COMPACT_FINAL_WITNESS_REQUIRED=1' "${marker_file}"; then
              final_required=1
            fi
          done
          if [ -e "${final_dir}" ] || [ -L "${final_dir}" ]; then
            test -d "${final_dir}"
            test ! -L "${final_dir}"
            python matrix/finalize_timed_86400_flowes_x3x3.py verify-public \
              "${RUNNER_TEMP}/folder-calming-oils-a" \
              "${final_dir}"
          elif [ "${final_required}" -eq 1 ]; then
            printf '%s\n' 'COMPACT_FINAL_OPTIONAL|state=REQUIRED_MISSING|json=0' >&2
            exit 1
          else
            printf '%s\n' 'COMPACT_FINAL_OPTIONAL|state=ABSENT|json=0'
          fi

      - name: Verify the 86,400-second FLOWes x3 x3 builder
        run: |
          mkdir "${RUNNER_TEMP}/flowes-x3x3-a"
          mkdir "${RUNNER_TEMP}/flowes-x3x3-b"
          for output in \
            "${RUNNER_TEMP}/flowes-x3x3-a" \
            "${RUNNER_TEMP}/flowes-x3x3-b"
          do
            python matrix/build_timed_86400_flowes_x3x3.py \
              "${RUNNER_TEMP}/folder-calming-oils-a" \
              "${output}" \
              --fake-clock-build
            python matrix/build_timed_86400_flowes_x3x3.py \
              "${RUNNER_TEMP}/folder-calming-oils-a" \
              "${output}" \
              --verify
          done
          for name in \
            TIMED-86400-FOLDER-CALMING-OILS-FLOWes-X3-X3-V2.hbp \
            TIMED-86400-FOLDER-CALMING-OILS-FLOWes-X3-X3-V2.hbp.sha256 \
            TIMED-86400-FOLDER-CALMING-OILS-FLOWes-X3-X3-V2.hbi \
            TIMED-86400-FOLDER-CALMING-OILS-FLOWes-X3-X3-V2.hbi.sha256 \
            TIMED-86400-FOLDER-CALMING-OILS-FLOWes-X3-X3-V2.svg \
            TIMED-86400-FOLDER-CALMING-OILS-FLOWes-X3-X3-V2.svg.sha256 \
            TIMED-86400-FOLDER-CALMING-OILS-FLOWes-X3-X3-V2.gguf \
            TIMED-86400-FOLDER-CALMING-OILS-FLOWes-X3-X3-V2.gguf.sha256 \
            TIMED-86400-FOLDER-CALMING-OILS-FLOWes-X3-X3-V2-STDOUT.hbp \
            TIMED-86400-FOLDER-CALMING-OILS-FLOWes-X3-X3-V2-STDOUT.hbp.sha256 \
            TIMED-86400-FOLDER-CALMING-OILS-FLOWes-X3-X3-V2-JOURNAL.hbp \
            TIMED-86400-FOLDER-CALMING-OILS-FLOWes-X3-X3-V2-JOURNAL.hbp.sha256
          do
            cmp "${RUNNER_TEMP}/flowes-x3x3-a/${name}" "${RUNNER_TEMP}/flowes-x3x3-b/${name}"
          done

      - name: Verify the compact final FLOWes witness tool
        run: python matrix/test_finalize_timed_86400_flowes_x3x3.py

      - name: Run the fixed public tournament
        run: >-
          python tournament/run_tournament.py
          --surface GITHUB_ACTIONS_LINUX
          --receipt "${{ runner.temp }}/GITHUB-ACTIONS-TOURNAMENT.hbp"

      - name: Retain the public tuple receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-is-tournament-receipt
          path: |
            ${{ runner.temp }}/GITHUB-ACTIONS-TOURNAMENT.hbp
            ${{ runner.temp }}/GITHUB-ACTIONS-TOURNAMENT.hbp.sha256
          if-no-files-found: error
          retention-days: 30
