name: Public IS tournament

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tournament:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the exact public revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Select Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Select Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Select exact Rust 1.81
        run: |
          rustup toolchain install 1.81.0 --profile minimal --component clippy,rustfmt
          test "$(rustc +1.81.0 --version)" = "rustc 1.81.0 (eeb90cda1 2024-09-04)"
          test "$(cargo +1.81.0 --version)" = "cargo 1.81.0 (2dbb1af80 2024-08-20)"

      - name: Verify the 3 D GitHub THRUTH matrix
        run: python matrix/verify_3d_github_harness.py

      - name: Verify the public spherical matrix
        run: |
          python matrix/test_owner3d_to_public2d.py
          python matrix/test_spherical_public_projection.py
          python matrix/test_render_public_spherical_svg.py
          python matrix/test_timed_chiral_gguf_monitor.py
          python matrix/spherical_public_projection.py verify matrix/PUBLIC-SPHERICAL-PROJECTION.hbp

      - name: Verify the exact-integer QPRISM color canopy
        run: |
          cargo +1.81.0 fmt --manifest-path matrix/rust-qprism-181/Cargo.toml -- --check
          cargo +1.81.0 test --manifest-path matrix/rust-qprism-181/Cargo.toml --locked
          cargo +1.81.0 clippy --manifest-path matrix/rust-qprism-181/Cargo.toml --all-targets --locked -- -D warnings -D clippy::float_arithmetic
          mkdir "${RUNNER_TEMP}/qprism"
          cargo +1.81.0 run --manifest-path matrix/rust-qprism-181/Cargo.toml --release --locked -- \
            matrix/PUBLIC-OWNER-2D.hbp \
            "${RUNNER_TEMP}/qprism/PUBLIC-QPRISM-COLOR-LEAVES.hbp" \
            "${RUNNER_TEMP}/qprism/PUBLIC-QPRISM-COLOR-LEAVES.svg" \
            --replace
          cmp "${RUNNER_TEMP}/qprism/PUBLIC-QPRISM-COLOR-LEAVES.hbp" matrix/PUBLIC-QPRISM-COLOR-LEAVES.hbp
          cmp "${RUNNER_TEMP}/qprism/PUBLIC-QPRISM-COLOR-LEAVES.hbp.sha256" matrix/PUBLIC-QPRISM-COLOR-LEAVES.hbp.sha256
          cmp "${RUNNER_TEMP}/qprism/PUBLIC-QPRISM-COLOR-LEAVES.svg" matrix/PUBLIC-QPRISM-COLOR-LEAVES.svg
          cmp "${RUNNER_TEMP}/qprism/PUBLIC-QPRISM-COLOR-LEAVES.svg.sha256" matrix/PUBLIC-QPRISM-COLOR-LEAVES.svg.sha256

      - name: Run the fixed public tournament
        run: >-
          python tournament/run_tournament.py
          --surface GITHUB_ACTIONS_LINUX
          --receipt "${{ runner.temp }}/GITHUB-ACTIONS-TOURNAMENT.hbp"

      - name: Retain the public tuple receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-is-tournament-receipt
          path: |
            ${{ runner.temp }}/GITHUB-ACTIONS-TOURNAMENT.hbp
            ${{ runner.temp }}/GITHUB-ACTIONS-TOURNAMENT.hbp.sha256
          if-no-files-found: error
          retention-days: 30
