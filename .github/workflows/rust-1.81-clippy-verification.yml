name: Rust 1.81 + clippy (operator toolchain rule)

# OPERATOR RULE: exact Rust 1.81.0 with clippy, integer/ternary only, no float.
# Historical receipts stay historical. Every current measurement is three-valued:
# MEASURED_PASS, MEASURED_FAIL, or NOT_MEASURED with a reason.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # FIX: RUSTUP_TOOLCHAIN outranks BOTH a directory override and any nested
      # rust-toolchain.toml. intelligent-terminal carries a nested
      # channel = "ms-prod-1.93" (third-party, MSRustup-resolved) that would
      # otherwise decide the toolchain for every crate under tools/wta/.
      RUSTUP_TOOLCHAIN: "1.81.0"
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Select exact Rust 1.81
        id: toolchain
        run: |
          set -u
          if rustup toolchain install 1.81.0 --profile minimal --component clippy,rustfmt \
            && test "$(rustc +1.81.0 --version)" = "rustc 1.81.0 (eeb90cda1 2024-09-04)" \
            && test "$(cargo +1.81.0 --version)" = "cargo 1.81.0 (2dbb1af80 2024-08-20)"; then
            echo "TOOLCHAIN|status=MEASURED_PASS|rustc=1.81.0|cargo=1.81.0"
            echo "verdict=MEASURED_PASS" >> "$GITHUB_OUTPUT"
          else
            echo "TOOLCHAIN|status=NOT_MEASURED|reason=EXACT_TOOLCHAIN_UNAVAILABLE"
            echo "verdict=NOT_MEASURED" >> "$GITHUB_OUTPUT"
          fi

      - name: Format every Rust 1.81 package
        id: fmt
        run: |
          set -u
          measured_fail=0
          not_measured=0
          measure() {
            label="$1"
            manifest="$2"
            shift 2
            if [ "${{ steps.toolchain.outputs.verdict }}" != "MEASURED_PASS" ]; then
              echo "FMT|package=$label|status=NOT_MEASURED|reason=TOOLCHAIN_UNAVAILABLE"
              not_measured=$((not_measured + 1))
            elif [ ! -f "$manifest" ]; then
              echo "FMT|package=$label|status=NOT_MEASURED|reason=MANIFEST_MISSING"
              not_measured=$((not_measured + 1))
            elif "$@"; then
              echo "FMT|package=$label|status=MEASURED_PASS"
            else
              echo "FMT|package=$label|status=MEASURED_FAIL"
              measured_fail=$((measured_fail + 1))
            fi
          }
          measure qprism matrix/rust-qprism-181/Cargo.toml cargo +1.81.0 fmt --manifest-path matrix/rust-qprism-181/Cargo.toml -- --check
          measure system_upgrade matrix/rust-system-upgrade-181/Cargo.toml cargo +1.81.0 fmt --manifest-path matrix/rust-system-upgrade-181/Cargo.toml -- --check
          measure honest_compressor_vc65 knowledge/public-dependencies/algorithms/tools/honest-compressor/rust/Cargo.toml cargo +1.81.0 fmt --manifest-path knowledge/public-dependencies/algorithms/tools/honest-compressor/rust/Cargo.toml -- --check
          if [ "$measured_fail" -gt 0 ]; then
            verdict=MEASURED_FAIL
          elif [ "$not_measured" -gt 0 ]; then
            verdict=NOT_MEASURED
          else
            verdict=MEASURED_PASS
          fi
          echo "FMT|status=$verdict|measured_fail=$measured_fail|not_measured=$not_measured"
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"

      - name: Test every Rust 1.81 package
        id: tests
        run: |
          set -u
          measured_fail=0
          not_measured=0
          measure() {
            label="$1"
            manifest="$2"
            shift 2
            if [ "${{ steps.toolchain.outputs.verdict }}" != "MEASURED_PASS" ]; then
              echo "TESTS|package=$label|status=NOT_MEASURED|reason=TOOLCHAIN_UNAVAILABLE"
              not_measured=$((not_measured + 1))
            elif [ ! -f "$manifest" ]; then
              echo "TESTS|package=$label|status=NOT_MEASURED|reason=MANIFEST_MISSING"
              not_measured=$((not_measured + 1))
            elif "$@"; then
              echo "TESTS|package=$label|status=MEASURED_PASS"
            else
              echo "TESTS|package=$label|status=MEASURED_FAIL"
              measured_fail=$((measured_fail + 1))
            fi
          }
          measure qprism matrix/rust-qprism-181/Cargo.toml cargo +1.81.0 test --manifest-path matrix/rust-qprism-181/Cargo.toml --all-targets --locked
          measure system_upgrade matrix/rust-system-upgrade-181/Cargo.toml cargo +1.81.0 test --manifest-path matrix/rust-system-upgrade-181/Cargo.toml --all-targets --locked
          measure honest_compressor_vc65 knowledge/public-dependencies/algorithms/tools/honest-compressor/rust/Cargo.toml cargo +1.81.0 test --manifest-path knowledge/public-dependencies/algorithms/tools/honest-compressor/rust/Cargo.toml --all-targets --locked
          if [ "$measured_fail" -gt 0 ]; then
            verdict=MEASURED_FAIL
          elif [ "$not_measured" -gt 0 ]; then
            verdict=NOT_MEASURED
          else
            verdict=MEASURED_PASS
          fi
          echo "TESTS|status=$verdict|measured_fail=$measured_fail|not_measured=$not_measured"
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"

      - name: Clippy every package with integer-only linting
        id: clippy
        run: |
          set -u
          measured_fail=0
          not_measured=0
          measure() {
            label="$1"
            manifest="$2"
            shift 2
            if [ "${{ steps.toolchain.outputs.verdict }}" != "MEASURED_PASS" ]; then
              echo "CLIPPY|package=$label|status=NOT_MEASURED|reason=TOOLCHAIN_UNAVAILABLE"
              not_measured=$((not_measured + 1))
            elif [ ! -f "$manifest" ]; then
              echo "CLIPPY|package=$label|status=NOT_MEASURED|reason=MANIFEST_MISSING"
              not_measured=$((not_measured + 1))
            elif "$@"; then
              echo "CLIPPY|package=$label|status=MEASURED_PASS"
            else
              echo "CLIPPY|package=$label|status=MEASURED_FAIL"
              measured_fail=$((measured_fail + 1))
            fi
          }
          measure qprism matrix/rust-qprism-181/Cargo.toml cargo +1.81.0 clippy --manifest-path matrix/rust-qprism-181/Cargo.toml --all-targets --locked -- -D warnings -D clippy::float_arithmetic
          measure system_upgrade matrix/rust-system-upgrade-181/Cargo.toml cargo +1.81.0 clippy --manifest-path matrix/rust-system-upgrade-181/Cargo.toml --all-targets --locked -- -D warnings -D clippy::float_arithmetic
          measure honest_compressor_vc65 knowledge/public-dependencies/algorithms/tools/honest-compressor/rust/Cargo.toml cargo +1.81.0 clippy --manifest-path knowledge/public-dependencies/algorithms/tools/honest-compressor/rust/Cargo.toml --all-targets --locked -- -D warnings -D clippy::float_arithmetic
          if [ "$measured_fail" -gt 0 ]; then
            verdict=MEASURED_FAIL
          elif [ "$not_measured" -gt 0 ]; then
            verdict=NOT_MEASURED
          else
            verdict=MEASURED_PASS
          fi
          echo "CLIPPY|status=$verdict|measured_fail=$measured_fail|not_measured=$not_measured"
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"

      - name: Enforce the full-system semantic migration ratchet
        id: ratchet
        run: |
          set -u
          if [ "${{ steps.toolchain.outputs.verdict }}" != "MEASURED_PASS" ]; then
            echo "RATCHET|status=NOT_MEASURED|reason=TOOLCHAIN_UNAVAILABLE"
            echo "verdict=NOT_MEASURED" >> "$GITHUB_OUTPUT"
          elif [ ! -f matrix/rust-system-upgrade-181/Cargo.toml ] \
            || [ ! -f matrix/SYSTEM-UPGRADE-RUST-181-BASELINE.hbp ]; then
            echo "RATCHET|status=NOT_MEASURED|reason=OWNING_INPUT_MISSING"
            echo "verdict=NOT_MEASURED" >> "$GITHUB_OUTPUT"
          elif cargo +1.81.0 run --manifest-path matrix/rust-system-upgrade-181/Cargo.toml --locked -- \
            verify . FOLLOW-THE-IS-PUBLIC-HARNESS matrix/SYSTEM-UPGRADE-RUST-181-BASELINE.hbp; then
            echo "RATCHET|status=MEASURED_PASS|semantic_float_scan=all_tracked_rs"
            echo "verdict=MEASURED_PASS" >> "$GITHUB_OUTPUT"
          else
            echo "RATCHET|status=MEASURED_FAIL"
            echo "verdict=MEASURED_FAIL" >> "$GITHUB_OUTPUT"
          fi

      - name: Seal the three-valued measurement receipt
        run: |
          {
            echo "RUST181CI|schema=ASOLARIA-RUST-181-THREE-VALUED-CI-V1|rustc=1.81.0|cargo=1.81.0|json=0"
            echo "VERDICTS|toolchain=${{ steps.toolchain.outputs.verdict }}|fmt=${{ steps.fmt.outputs.verdict }}|tests=${{ steps.tests.outputs.verdict }}|clippy=${{ steps.clippy.outputs.verdict }}|semantic_ratchet=${{ steps.ratchet.outputs.verdict }}|json=0"
            echo "PACKAGES|qprism=1|system_upgrade=1|honest_compressor_vc65=1|json=0"
            echo "BOUNDARY|historical_receipts_rewritten=0|system_affirmed=0|json=0"
          } > "${RUNNER_TEMP}/RUST-181-CLIPPY.hbp"
          (
            cd "${RUNNER_TEMP}"
            sha256sum RUST-181-CLIPPY.hbp > RUST-181-CLIPPY.hbp.sha256
          )

      - name: Retain the measured CI receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rust-1.81-clippy-receipt
          path: |
            ${{ runner.temp }}/RUST-181-CLIPPY.hbp
            ${{ runner.temp }}/RUST-181-CLIPPY.hbp.sha256
          if-no-files-found: error

      - name: Gate measured failures without inventing measurements
        run: |
          set -u
          measured_fail=0
          not_measured=0
          for verdict in \
            "${{ steps.toolchain.outputs.verdict }}" \
            "${{ steps.fmt.outputs.verdict }}" \
            "${{ steps.tests.outputs.verdict }}" \
            "${{ steps.clippy.outputs.verdict }}" \
            "${{ steps.ratchet.outputs.verdict }}"; do
            if [ "$verdict" = "MEASURED_FAIL" ]; then
              measured_fail=$((measured_fail + 1))
            elif [ "$verdict" != "MEASURED_PASS" ]; then
              not_measured=$((not_measured + 1))
            fi
          done
          echo "GATE|measured_fail=$measured_fail|not_measured=$not_measured"
          if [ "$measured_fail" -gt 0 ]; then
            echo "GATE|result=RED|reason=ONE_OR_MORE_MEASUREMENTS_FAILED"
            exit 1
          fi
          if [ "$not_measured" -gt 0 ]; then
            echo "GATE|result=NOT_MEASURED|reason=ONE_OR_MORE_MEASUREMENTS_COULD_NOT_RUN"
            exit 0
          fi
          echo "GATE|result=GREEN|reason=ALL_REQUIRED_MEASUREMENTS_PASSED"
